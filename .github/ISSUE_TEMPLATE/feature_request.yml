name: Idea or feature request
description: A command, option, or behaviour that would make your day easier.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or question, not the solution yet. "Every morning I have to..." is perfect.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: A command you wish existed, an output you would like to see, anything.
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I'd like to work on this (a maintainer will help you get started)
