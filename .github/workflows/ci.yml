name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install shell integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: bash -n netops-connect netops-control netops-discovery netops-legacy netops-probe netops-lib.sh install.sh uninstall.sh scripts/check_generated.sh scripts/smoke_wheel.sh scripts/smoke_install.sh
      - run: python generate_reference.py --check
      - run: python privacy_check.py --root .

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm audit --audit-level=high
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - run: git diff --exit-code -- webui/dist

  package:
    runs-on: ubuntu-latest
    needs: [python, webui]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: unzip -Z1 dist/*.whl | grep -q 'share/netops-platform/webui/dist/index.html'
      - run: python privacy_check.py --root . dist/*.whl dist/*.tar.gz
      - name: Scan independent public Git history
        if: github.repository == 'zane8n/netops-platform'
        run: python privacy_check.py --root . --git-history
      - run: bash scripts/smoke_wheel.sh dist/*.whl
      - run: bash scripts/smoke_install.sh dist/*.whl
      - run: python build_release.py dist --output .release
      - run: python -m pip_audit --strict .
      - uses: actions/upload-artifact@v7
        with:
          name: netops-platform-dist
          include-hidden-files: true
          path: |
            dist/*
            .release/*
