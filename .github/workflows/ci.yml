name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install shell integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: bash -n netrune-connect netrune-control netrune-discovery netrune-legacy netrune-probe netrune-lib.sh netops-connect netops-control netops-discovery netops-legacy netops-probe netops-lib.sh install.sh uninstall.sh scripts/check_generated.sh scripts/smoke_wheel.sh scripts/smoke_install.sh
      - run: python scripts/generate_reference.py --check
      - run: python scripts/privacy_check.py --root .

  package:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/privacy_check.py --root . dist/*.whl dist/*.tar.gz
      - name: Scan independent public Git history
        if: github.repository == 'zane8n/netrune'
        run: python scripts/privacy_check.py --root . --git-history
      - run: bash scripts/smoke_wheel.sh dist/*.whl
      - run: bash scripts/smoke_install.sh dist/*.whl
      - run: python scripts/build_release.py dist --output .release
      - run: python -m pip_audit --strict .
      - uses: actions/upload-artifact@v7
        with:
          name: netrune-dist
          include-hidden-files: true
          path: |
            dist/*
            .release/*
