[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-platform"
dynamic = ["version"]
description = "Local-first network operations console and automation toolkit"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
authors = [{name = "NetOps maintainers"}]
keywords = ["network-operations", "network-automation", "diagnostics", "inventory", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "rich>=14,<16",
  "textual==8.2.8",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-textual-snapshot==1.1.0",
  "twine>=6,<7",
  "pip-audit>=2.9,<3",
]

[project.urls]
Documentation = "https://github.com/zane8n/netops-platform#readme"
Issues = "https://github.com/zane8n/netops-platform/issues"
Source = "https://github.com/zane8n/netops-platform"

[project.scripts]
netops = "netops_platform.launcher:main"
netop = "netops_platform.launcher:main"

[tool.setuptools]
py-modules = [
  "netops_core",
  "netops_ask",
  "netops_devices",
  "netops_identity",
  "netops_ingest",
  "netops_mac_registry",
  "netops_network",
  "netops_speed",
]
script-files = [
  "netops-connect",
  "netops-control",
  "netops-discovery",
  "netops-legacy",
  "netops-probe",
  "netops_aruba_ssh.exp",
  "netops-lib.sh",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
include = ["netops_platform*"]

[tool.setuptools.package-data]
netops_platform = ["tui/*.tcss"]

[tool.setuptools.data-files]
"share/netops-platform/webui/dist" = ["webui/dist/index.html"]
"share/netops-platform/webui/dist/assets" = [
  "webui/dist/assets/*.css",
  "webui/dist/assets/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
