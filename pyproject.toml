[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netrune"
dynamic = ["version"]
description = "Local-first network operations console, diagnostics, and automation toolkit"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
authors = [{name = "Netrune maintainers"}]
keywords = ["netrune", "network-operations", "network-automation", "diagnostics", "inventory", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "rich>=14,<16",
]

[project.optional-dependencies]
excel = [
  "openpyxl>=3.1,<4",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "twine>=6,<7",
  "pip-audit>=2.9,<3",
  "openpyxl>=3.1,<4",
]

[project.urls]
Documentation = "https://github.com/zane8n/netrune#readme"
Issues = "https://github.com/zane8n/netrune/issues"
Source = "https://github.com/zane8n/netrune"

[project.scripts]
netrune = "netrune.launcher:main"
netops = "netrune.launcher:main"
netop = "netrune.launcher:main"

[tool.setuptools]
py-modules = [
  "netops_core",
  "netops_ask",
  "netops_devices",
  "netops_identity",
  "netops_ingest",
  "netops_mac_registry",
  "netops_network",
  "netops_speed",
]
script-files = [
  "netrune-connect",
  "netrune-control",
  "netrune-discovery",
  "netrune-legacy",
  "netrune-probe",
  "netrune_aruba_ssh.exp",
  "netrune-lib.sh",
  "netops-connect",
  "netops-control",
  "netops-discovery",
  "netops-legacy",
  "netops-probe",
  "netops_aruba_ssh.exp",
  "netops-lib.sh",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
include = ["netrune*", "netops_platform*"]

[tool.setuptools.package-data]

[tool.setuptools.data-files]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
